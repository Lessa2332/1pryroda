<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Настільна STEM-Гра: Квест Дослідника</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.85);
            --accent: #38bdf8;
            --p1-color: #38bdf8;
            --p2-color: #22c55e;
            --p3-color: #f97316;
            --text-main: #f8fafc;
            --radius: 16px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; touch-action: manipulation; }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
        }

        /* Табло гравців */
        .scoreboard {
            width: 100%;
            max-width: 800px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }

        .player-card {
            background: var(--card-bg);
            border: 2px solid transparent;
            border-radius: var(--radius);
            padding: 8px;
            text-align: center;
            transition: all 0.3s;
        }

        .player-card.active {
            border-color: #fff;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
            transform: scale(1.03);
        }

        .p1 { color: var(--p1-color); }
        .p2 { color: var(--p2-color); }
        .p3 { color: var(--p3-color); }

        .score-val { font-size: 1.2rem; font-weight: bold; margin-top: 4px; }

        /* Гральне поле (Дошка) */
        .board-container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
        }

        .board-path {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        @media (max-width: 500px) {
            .board-path { grid-template-columns: repeat(3, 1fr); gap: 6px; }
        }

        .cell {
            aspect-ratio: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 2px dashed rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .cell.start { border-color: #22c55e; background: rgba(34, 197, 94, 0.1); }
        .cell.finish { border-color: #f59e0b; background: rgba(245, 158, 11, 0.1); }

        .cell-num {
            position: absolute;
            top: 4px;
            left: 6px;
            font-size: 0.7rem;
            color: #94a3b8;
        }

        /* Фішки Гравців */
        .tokens-container {
            display: flex;
            gap: 2px;
            position: absolute;
            bottom: 4px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .token {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 2px solid #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            transition: all 0.4s ease;
        }

        .token.p1 { background: var(--p1-color); }
        .token.p2 { background: var(--p2-color); }
        .token.p3 { background: var(--p3-color); }

        /* Панель керування та кубик */
        .controls {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .dice-btn {
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            border: none;
            color: #fff;
            padding: 12px 24px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .dice-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .dice-val {
            font-size: 1.5rem;
            background: rgba(255,255,255,0.2);
            width: 35px;
            height: 35px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
        }

        /* Модальне вікно запитання */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .modal.open { display: flex; }

        .card {
            background: #1e293b;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 20px;
            padding: 20px;
            max-width: 500px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .opt-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            padding: 12px;
            border-radius: 12px;
            text-align: left;
            font-size: 0.95rem;
            cursor: pointer;
        }

        .opt-btn.correct { background: #22c55e !important; }
        .opt-btn.wrong { background: #ef4444 !important; }
    </style>
</head>
<body>

    <!-- Табло гравців -->
    <div class="scoreboard">
        <div class="player-card p1 active" id="pCard-0">
            <div>🔵 Команда 1</div>
            <div class="score-val" id="pScore-0">Клітинка: 0</div>
        </div>
        <div class="player-card p2" id="pCard-1">
            <div>🟢 Команда 2</div>
            <div class="score-val" id="pScore-1">Клітинка: 0</div>
        </div>
        <div class="player-card p3" id="pCard-2">
            <div>🟠 Команда 3</div>
            <div class="score-val" id="pScore-2">Клітинка: 0</div>
        </div>
    </div>

    <!-- Гральна дошка -->
    <div class="board-container">
        <div class="board-path" id="boardPath"></div>
        
        <div class="controls">
            <button class="dice-btn" id="diceBtn" onclick="rollDice()">
                🎲 Кинути кубик <span class="dice-val" id="diceVal">?</span>
            </button>
            <div id="statusText">Хід Команди 1 (🔵). Кидайте кубик!</div>
        </div>
    </div>

    <!-- Модалка запитань -->
    <div class="modal" id="modal">
        <div class="card">
            <h3 id="modalPlayer" style="text-align: center;">Запитання</h3>
            <p id="qText" style="font-size: 1.1rem;"></p>
            <div id="options" style="display: flex; flex-direction: column; gap: 8px;"></div>
        </div>
    </div>

    <script>
        const questions = [
            { icon: "🚀", title: "СТАРТ! Запитання для розігріву: Що з переліченого є тілом ЖИВОЇ природи?", options: ["Гірська порода", "Сонечко (комаха) 🐞", "Річковий пісок"], correct: 1 },
            { icon: "🪨", title: "Знайди РУКОТВОРНЕ тіло (створене людиною):", options: ["Морська мушля", "Пластикова пляшка 🍾", "Хмара в небі"], correct: 1 },
            { icon: "🌋", title: "Чому вулкан вивчають за допомогою МОДЕЛІ, а не впритул?", options: ["Це нецікаво", "Це небезпечно для життя ⚠️", "Вулкан занадто малий"], correct: 1 },
            { icon: "🌍", title: "Океан — це об'єкт природи. А що таке ГЛОБУС?", options: ["Рукотворна модель Землі 🌐", "Живий організм", "Явище природи"], correct: 0 },
            { icon: "📖", title: "Де найточніше шукати класифікацію птахів?", options: ["В науковій енциклопедії 📚", "У казці", "У повідомленні без автора"], correct: 0 },
            { icon: "🔬", title: "Яке призначення має МІКРОСКОП або ЛУПА?", options: ["Змінює колір", "Дозволяє розглянути дрібні детали 🔍", "Вимірює вагу"], correct: 1 },
            { icon: "🗺️", title: "Що є КАРТОГРАФІЧНИМ джерелом знань?", options: ["Фізична карта України 🗺️", "Атлас тканин", "Термометр"], correct: 0 },
            { icon: "📱", title: "У чому перевага 3D-моделі чи AR (доповненої реальності)?", options: ["Замінює природу", "Дозволяє роздивитися з усіх боків 🔄", "З нею не треба вчитися"], correct: 1 },
            { icon: "🍓", title: "Ти знайшов у лісі невідому ягоду. Твої дії?", options: ["З'їсти", "Зірвати", "Не торкатися і не куштувати 🚫"], correct: 2 },
            { icon: "⚠️", title: "Головне правило безпеки під час дослідження в класі:", options: ["Бігати", "Слухати вчителя та бути обережним 🥼", "Чіпати все підряд"], correct: 1 },
            { icon: "🤝", title: "Ваш партнер у парі пропонує ідею. Як вчинити?", options: ["Перебити", "Обговорити разом 💬", "Проігнорувати"], correct: 1 },
            { icon: "🏆", title: "ФІНІШ! Чому моделі важливі для людини?", options: ["Допомагають безпечно пізнавати світ 🌟", "Потрібні лише для оцінки", "Не мають цінності"], correct: 0 }
        ];

        const TOTAL_CELLS = 12;
        let players = [
            { id: 0, name: "Команда 1", color: "p1", pos: 0 },
            { id: 1, name: "Команда 2", color: "p2", pos: 0 },
            { id: 2, name: "Команда 3", color: "p3", pos: 0 }
        ];
        let currentPlayer = 0;

        const boardPath = document.getElementById('boardPath');
        const diceVal = document.getElementById('diceVal');
        const diceBtn = document.getElementById('diceBtn');
        const statusText = document.getElementById('statusText');
        const modal = document.getElementById('modal');

        // Ініціалізація дошки
        function createBoard() {
            boardPath.innerHTML = '';
            for (let i = 0; i < TOTAL_CELLS; i++) {
                const cell = document.createElement('div');
                cell.className = `cell ${i === 0 ? 'start' : ''} ${i === TOTAL_CELLS - 1 ? 'finish' : ''}`;
                cell.id = `cell-${i}`;
                
                const num = document.createElement('span');
                num.className = 'cell-num';
                num.textContent = i === 0 ? 'СТАРТ' : (i === TOTAL_CELLS - 1 ? 'ФІНІШ' : i);
                
                const icon = document.createElement('span');
                icon.textContent = questions[i].icon;

                const tokensCont = document.createElement('div');
                tokensCont.className = 'tokens-container';
                tokensCont.id = `tokens-${i}`;

                cell.appendChild(num);
                cell.appendChild(icon);
                cell.appendChild(tokensCont);
                boardPath.appendChild(cell);
            }
            renderTokens();
        }

        function renderTokens() {
            // Очистити всі фішки
            for (let i = 0; i < TOTAL_CELLS; i++) {
                document.getElementById(`tokens-${i}`).innerHTML = '';
            }
            // Відобразити поточні позиції
            players.forEach(p => {
                const token = document.createElement('div');
                token.className = `token ${p.color}`;
                document.getElementById(`tokens-${p.pos}`).appendChild(token);
                document.getElementById(`pScore-${p.id}`).textContent = `Клітинка: ${p.pos}`;
            });
        }

        function rollDice() {
            diceBtn.disabled = true;
            let rolls = 0;
            const interval = setInterval(() => {
                const rand = Math.floor(Math.random() * 3) + 1; // 1-3 для оптимального ходу
                diceVal.textContent = rand;
                rolls++;
                if (rolls > 10) {
                    clearInterval(interval);
                    movePlayer(rand);
                }
            }, 50);
        }

        function movePlayer(steps) {
            let p = players[currentPlayer];
            p.pos = Math.min(p.pos + steps, TOTAL_CELLS - 1);
            renderTokens();

            setTimeout(() => {
                openQuestion(p.pos);
            }, 600);
        }

        function openQuestion(cellIndex) {
            const q = questions[cellIndex];
            document.getElementById('modalPlayer').textContent = `Запитання для ${players[currentPlayer].name}`;
            document.getElementById('qText').textContent = q.title;
            const optsContainer = document.getElementById('options');
            optsContainer.innerHTML = '';

            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'opt-btn';
                btn.textContent = opt;
                btn.onclick = () => checkAnswer(idx, q.correct);
                optsContainer.appendChild(btn);
            });

            modal.classList.add('open');
        }

        function checkAnswer(selected, correct) {
            const btns = document.getElementById('options').children;
            for (let b of btns) b.style.pointerEvents = 'none';

            if (selected === correct) {
                btns[selected].classList.add('correct');
            } else {
                btns[selected].classList.add('wrong');
                btns[correct].classList.add('correct');
                // Штраф: крок назад при помилці
                if (players[currentPlayer].pos > 0) players[currentPlayer].pos--;
            }

            setTimeout(() => {
                modal.classList.remove('open');
                renderTokens();
                checkWinOrNext();
            }, 1200);
        }

        function checkWinOrNext() {
            let p = players[currentPlayer];
            if (p.pos === TOTAL_CELLS - 1) {
                statusText.innerHTML = `🎉 <strong>ПОБЕДА! ${p.name} першою дійшла до Фінішу!</strong>`;
                diceBtn.disabled = true;
                return;
            }

            // Перехід ходу
            document.getElementById(`pCard-${currentPlayer}`).classList.remove('active');
            currentPlayer = (currentPlayer + 1) % players.length;
            document.getElementById(`pCard-${currentPlayer}`).classList.add('active');

            statusText.textContent = `Зараз хід: ${players[currentPlayer].name}. Кидайте кубик!`;
            diceBtn.disabled = false;
        }

        createBoard();
    </script>
</body>
</html>
